version: 2

updates:

  # Composer (Laravel)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "composer"
    ignore:
      # endroid/qr-code 6.x declara php ^8.4 (6.2.0 já pede ^8.5) e a plataforma
      # do projeto é php ^8.3, por isso `composer install --locked` falha sempre.
      - dependency-name: "endroid/qr-code"
        update-types:
          - version-update:semver-major

  # npm (Vite)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # @fullcalendar/daygrid, /timegrid and /interaction have no 7.x release
      # (npm dist-tags "latest" is still 6.1.22), so a core major bump alone
      # always breaks `npm ci` with ERESOLVE on the ~6.1.x peer ranges.
      - dependency-name: "@fullcalendar/core"
        update-types:
          - version-update:semver-major
    groups:
      # @fullcalendar/* plugins declare peer @fullcalendar/core ~<same minor>.
      # Bumping one package alone makes `npm ci` fail with ERESOLVE, so these
      # versions must always change together in a single PR.
      fullcalendar:
        patterns:
          - "@fullcalendar/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
